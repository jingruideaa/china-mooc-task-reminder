<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MOOC 任务提醒</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="eyebrow">学习任务 · 每日提醒</div>
    <h1>中国大学 MOOC</h1>
    <p class="subtitle">每天北京时间 20:00，检查全部在学课程</p>
  </header>
  <main>
    <div id="status" class="status" role="status" aria-live="polite">正在读取状态…</div>
    <div id="error" class="notice" role="alert" hidden></div>
    <div class="actions">
      <button id="run" class="primary">立即检查并发邮件</button>
      <button id="retry" class="secondary" hidden>重发报告邮件</button>
    </div>
    <label class="auto-review"><input id="auto-review" type="checkbox"><span>自动完成未完成的自评、互评<small>各评分项选择最高分并提交；结果记入日报。</small></span></label>
    <section id="summary" class="summary" aria-label="上次检查的任务统计" hidden>
      <div><strong id="count-pending">0</strong><span>未完成</span></div>
      <div><strong id="count-urgent">0</strong><span>24 小时内</span></div>
      <div><strong id="count-near">0</strong><span>7 天内</span></div>
      <div><strong id="count-uncertain">0</strong><span>待核实</span></div>
    </section>
    <p id="snapshot" class="meta"></p>
    <nav id="filters" class="filters" aria-label="筛选上次检查的任务" hidden>
      <button data-filter="pending" aria-pressed="true">未完成</button>
      <button data-filter="near" aria-pressed="false">临近截止</button>
      <button data-filter="exams" aria-pressed="false">考试</button>
      <button data-filter="uncertain" aria-pressed="false">待核实</button>
    </nav>
    <section id="tasks" class="tasks" aria-label="任务清单"></section>
    <p id="mail" class="meta"></p>
    <p id="next" class="meta"></p>
    <details>
      <summary>完整报告</summary>
      <button id="copy" class="secondary copy" disabled>复制报告</button>
      <pre id="report">暂无报告</pre>
    </details>
  </main>
  <footer>电脑、浏览器和邮件服务需保持运行。清单以检查时的网站记录为准；登录过期会提示。<span id="version"></span></footer>
  <script src="presentation.js"></script>
  <script src="popup.js"></script>
</body>
</html>
